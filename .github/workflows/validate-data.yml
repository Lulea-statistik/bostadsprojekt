name: Validate housing project data
on:
  push:
    paths:
      - "data/**"
      - "snapshots/**"
      - "scripts/validate_data.py"
  pull_request:
    paths:
      - "data/**"
      - "snapshots/**"
      - "scripts/validate_data.py"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_data.py
